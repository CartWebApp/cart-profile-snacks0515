name: Autograder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright beautifulsoup4 webcolors
        playwright install --with-deps chromium

    - name: Run Autograder Tests
      run: |
        pytest test_autograder.py --junitxml=results.xml
      env:
        SUBMISSION_URL: "file://${{ github.workspace }}/index.html"

    - name: Publish Test Results
      if: always()
      uses: mikepimpoint/junit-report-action@v1
      with:
        report_paths: 'results.xml'
        token: ${{ secrets.GITHUB_TOKEN }}